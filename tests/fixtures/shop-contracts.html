<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ショップ失敗接続</title>
  <main id="shop"></main><output id="attempts">0</output>
  <script type="module">
    import { mountItemShop } from "/src/web/itemShopUi.ts";
    import "/src/web/style.css";

    let balance=30,count=0,attempts=0;
    mountItemShop(document.querySelector("#shop"),{
      balance:()=>balance,count:()=>count,
      buy:quantity=>{
        document.querySelector("#attempts").textContent=String(++attempts);
        if(attempts===1)return false;
        balance-=10*quantity;count+=quantity;return true;
      },
    }).render(true);
  </script>
</html>
