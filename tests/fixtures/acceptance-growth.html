<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>取得場面の受入</title>
  <main id="choice"></main><output id="learned"></output>
  <script type="module">
    import { growthRules } from "/src/content/growthRules.ts";
    import { skillCatalog } from "/src/content/skillDefinitions.ts";
    import { chooseSkill, createExplorationSkills, grantSkillExperience } from "/src/game/skillAcquisition.ts";
    import { mountGrowthChoice } from "/src/web/growthChoiceUi.ts";
    import "/src/web/style.css";

    const initial = createExplorationSkills("acceptance", 3, growthRules.progression, skillCatalog);
    const reward = grantSkillExperience(initial, "acceptance", { id: "fixture", allocations: [{ characterId: "player", experience: 10 }] }, growthRules.progression, skillCatalog);
    if (!reward.accepted) throw new Error(reward.reason);
    mountGrowthChoice(document.querySelector("#choice"), reward.state, skillCatalog, { player: "ロッシ" }, input => {
      const result = chooseSkill(reward.state, input, skillCatalog);
      if (!result.accepted) throw new Error(result.reason);
      document.querySelector("#learned").textContent = result.state.characters.find(({ characterId }) => characterId === "player").learned.map(entry => entry.skillId).join(",");
    });
  </script>
</html>
