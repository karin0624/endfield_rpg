<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>戦闘表示の寿命テスト</title>
  <nav style="position: fixed; left: 12px; top: 12px; z-index: 30; background: white">
    <button type="button" id="full">2対2を表示</button>
    <button type="button" id="small">1対1を表示</button>
    <button type="button" id="interrupt">撃破中に切替</button>
    <button type="button" id="attack-interrupt">攻撃直後に切替</button>
    <button type="button" id="stale">旧表示に操作</button>
    <button type="button" id="settings">敵位置を変更</button>
    <button type="button" id="environment">別の環境を表示</button>
    <button type="button" id="dispose">描画を破棄</button>
    <output id="status" aria-label="表示状態">開始前</output>
    <output id="rect" aria-label="敵画像の左端"></output>
    <output id="late" aria-label="古い演出の完了回数">0</output>
    <output id="loaded" aria-label="環境読込の完了回数">0</output>
  </nav>
  <main class="battle-screen">
    <div class="game-board" id="board">
      <section class="stage"><canvas aria-label="寿命テストの戦闘"></canvas></section>
    </div>
  </main>
  <script type="module">
    import { SceneLoader } from "@babylonjs/core/Loading/sceneLoader";
    import { initialBattleCombatants } from "/src/content/initialBattle.ts";
    import { advanceBattleToNextAllyInput, createBattleState } from "/src/game/battle.ts";
    import savedSettings from "/src/web/battle-settings.json";
    import { createBattleRenderer, initialBattleEnvironment } from "/src/web/battleScene.ts";
    import { parseBattleSettings } from "/src/web/battleSettings.ts";
    import { mountBattleUi } from "/src/web/battleUi.ts";
    import "/src/web/style.css";

    const board = document.querySelector("#board");
    const canvas = board.querySelector("canvas");
    const status = document.querySelector("#status");
    const rect = document.querySelector("#rect");
    const late = document.querySelector("#late");
    const full = initialBattleCombatants;
    const small = full.filter(({ id }) => id === "player" || id === "slime-2");
    let settings = parseBattleSettings(savedSettings);
    let renderer;
    let current;
    let previous;
    let disposeUi;
    let lateCompletions = 0;
    let completedLoads = 0;
    const loaderObserver = SceneLoader.OnPluginActivatedObservable.add((plugin) => {
      plugin.onCompleteObservable?.addOnce(() => {
        document.querySelector("#loaded").textContent = String(++completedLoads);
      });
    });

    function refreshRect() {
      current?.refreshCombatantScreenPositions();
      rect.textContent = String(current?.getCombatantScreenRect("slime-2")?.left ?? "非表示");
      late.textContent = String(lateCompletions);
    }

    async function show(combatants, environment = initialBattleEnvironment) {
      disposeUi?.();
      disposeUi = undefined;
      previous = current;
      renderer ??= createBattleRenderer(canvas, settings);
      const next = renderer.beginBattle(combatants, environment);
      current = next;
      status.textContent = "読込中";
      try {
        await next.ready;
        if (current !== next) return;
        disposeUi = mountBattleUi(board, next, {
          combatants,
          initialState: advanceBattleToNextAllyInput(createBattleState(combatants)).state,
        });
        refreshRect();
        status.textContent = `${combatants.length}人の表示完了`;
      } catch (error) {
        if (current === next) status.textContent = `読込失敗: ${error}`;
      }
    }

    function dispose() {
      disposeUi?.();
      disposeUi = undefined;
      previous = current;
      current = undefined;
      renderer?.dispose();
      renderer?.dispose();
      renderer = undefined;
      previous?.dispose();
      previous?.dispose();
      status.textContent = "破棄済み";
      refreshRect();
    }

    document.querySelector("#full").onclick = () => void show(full);
    document.querySelector("#small").onclick = () => void show(small);
    document.querySelector("#interrupt").onclick = () => {
      current?.playCombatantEffect("slime-2", "defeat", true, () => { lateCompletions += 1; });
      void show(small);
    };
    document.querySelector("#attack-interrupt").onclick = () => {
      board.querySelector("[data-attack]").click();
      void show(small);
    };
    document.querySelector("#stale").onclick = () => {
      previous?.applySettings({ ...settings, enemyCenterX: 8 });
      previous?.playCombatantEffect("slime-2", "defeat", true, () => { lateCompletions += 1; });
      previous?.resetCombatantPresentation();
      previous?.getFrontmostEnemyId(["slime-2"]);
      previous?.dispose();
      previous?.dispose();
      refreshRect();
    };
    document.querySelector("#settings").onclick = () => {
      settings = { ...settings, enemyCenterX: settings.enemyCenterX + 1.5 };
      current?.applySettings(settings);
      refreshRect();
    };
    document.querySelector("#environment").onclick = () => void show(small, {
      ground: "ground/ground1.glb?environment=alternate",
      background: "backgrounds/dungeon-route.png",
    });
    document.querySelector("#dispose").onclick = dispose;
    window.addEventListener("pagehide", () => {
      dispose();
      SceneLoader.OnPluginActivatedObservable.remove(loaderObserver);
    }, { once: true });
  </script>
</html>
