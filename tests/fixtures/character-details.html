<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>習得詳細の表示条件</title>
  <div class="adventure-screen party-editing"><div class="town-view"><section class="party-editor" id="fixture" aria-label="出撃編成"></section></div></div>
  <button type="button" id="reset">帰還時の育成初期化</button><button type="button" id="snapshot">状態を確認</button><output hidden id="state"></output>
  <script type="module">
    import { characters } from "/src/content/characters.ts";
    import { growthRules } from "/src/content/growthRules.ts";
    import { initialGameOptions } from "/src/content/initialGameOptions.ts";
    import { mentalFatigueDefinition } from "/src/content/mentalFatigueDefinition.ts";
    import { skillCatalog } from "/src/content/skillDefinitions.ts";
    import { createInitialGameState } from "/src/game/createInitialGameState.ts";
    import { applyPartyStatus } from "/src/game/expedition.ts";
    import { chooseGrowthSkill, grownCharacters, rewardGrowth } from "/src/game/growthRuntime.ts";
    import { createParty } from "/src/game/party.ts";
    import { resetExplorationSkills } from "/src/game/skillAcquisition.ts";
    import { mountPartyUi } from "/src/web/partyUi.ts";
    import "/src/web/style.css";

    const params = new URLSearchParams(location.search);
    const mode = params.get("mode");
    const definitions = characters.map(c => c.id === "player" ? { ...c, name: "長い名前のロッシ（習得した技と現在の状態を確認する）" } : c);
    const catalog = { ...skillCatalog,
      skills: skillCatalog.skills.map(s => s.id === "test-heal" ? { ...s, description: s.description.repeat(12) } : s.id === "test-strength" ? { ...s, effect: { ...s.effect, rankAmounts: [2, 4, 6] } } : s),
      pools: skillCatalog.pools.map(p => ({ ...p, candidates: { ...p.candidates, normal: ["test-strength", "test-vitality", "test-power"] } })),
      characters: skillCatalog.characters.map(p => ({ ...p, guaranteedUnlocks: [{ skillId: "test-light-strike", level: 2 }], initialSkillIds: mode === "unknown" ? null : mode === "empty" ? [] : [...p.initialSkillIds, "test-strength"] }))
    };
    const rules = { catalog, fatigue: mentalFatigueDefinition, growth: { ...growthRules, characters: definitions } };
    let game = { adventure: createInitialGameState(initialGameOptions), party: createParty(definitions, ["player"]), dungeon: null, randomState: 731 };
    if (!mode) {
      const reward = rewardGrowth(game, { id: "fixture-xp", allocations: [{ characterId: "player", experience: 30 }] }, rules);
      if (!reward.accepted) throw new Error(reward.reason);
      game = reward.state;
      for (const skillId of ["test-strength", "test-vitality", "test-vitality"]) {
        const choice = game.growth.choice;
        const result = chooseGrowthSkill(game, { explorationId: game.growth.explorationId, characterId: "player", level: choice.level, skillId }, rules);
        if (!result.accepted) throw new Error(result.reason);
        game = result.state;
      }
    }
    game = applyPartyStatus(game, "player", { kind: "physicalFatigue", amount: 25 }, definitions);
    game = applyPartyStatus(game, "player", { kind: "haze", amount: 25 }, definitions);
    const capture = () => { document.querySelector("#state").textContent = JSON.stringify(game); };
    document.querySelector("#snapshot").onclick = capture;
    document.querySelector("#reset").onclick = () => {
      const result = resetExplorationSkills(game.growth, game.growth.explorationId, growthRules.progression, catalog);
      if (!result.accepted) throw new Error(result.reason);
      game = { ...game, growth: result.state };
      capture();
    };
    mountPartyUi(document.querySelector("#fixture"), {
      characters: grownCharacters(game, rules), getParty: () => game.party, getCalendarLabel: () => "1日目 · 昼",
      getDetailsContext: () => ({ characters: grownCharacters(game, rules), baseCharacters: definitions, growth: game.growth, rules }),
      edit: () => { throw new Error("閲覧中に編集されました"); }, depart: () => { throw new Error("閲覧中に出撃しました"); },
    }, () => {});
    capture();
  </script>
</html>
