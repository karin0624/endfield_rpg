<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成長の公開入力契約</title>
  <main id="choice"></main><output id="state" hidden></output><output id="commits">0</output>
  <script type="module">
    import { chooseSkill, createExplorationSkills, grantSkillExperience } from "/src/game/skillAcquisition.ts";
    import { mountGrowthChoice } from "/src/web/growthChoiceUi.ts";
    import "/src/web/style.css";

    const ids = ["player", "companion"];
    const progression = {
      initial: ids.map(characterId => ({characterId, level:1, experience:0, bonus:{maxHp:0,attackPower:0}})),
      rules: [{fromLevel:1,requiredExperience:10,bonus:{maxHp:1,attackPower:0}}],
    };
    const shortage = new URLSearchParams(location.search).has("shortage");
    const catalog = {
      skills: [
        ...["normal", "advanced", "ultimate"].flatMap(tier => ["known", "new", "other"].map(name=>({id:tier === "normal" ? name : `${tier}-${name}`,name,description:`${name}の効果`,tier,type:"passive",effect:{type:"basic-attack-power-bonus",rankAmounts:shortage && name === "other" ? [2] : [2,4,6]}}))),
        {id:"guaranteed",name:"保証技",description:"保証される攻撃",tier:"normal",type:"active",effect:{type:"damage",amount:1,scaling:{stat:"attackPower",coefficient:1}},mentalFatigueIncrease:0,scenes:["battle"],target:"single-enemy"},
      ],
      pools:[{id:"pool",candidates:{normal:["known","new","other"],advanced:["advanced-known","advanced-new","advanced-other"],ultimate:["ultimate-known","ultimate-new","ultimate-other"]}}],
      characters:ids.map(characterId=>({characterId,poolId:"pool",initialSkillIds:shortage?["known","other"]:["known"],guaranteedUnlocks:[{level:2,skillId:"guaranteed"}]})),
    };
    const initial = createExplorationSkills("ui-contract", 1, progression, catalog);
    const result = grantSkillExperience(initial,"ui-contract",{id:"reward",allocations:ids.map(characterId=>({characterId,experience:10}))},progression,catalog);
    if(!result.accepted) throw new Error(result.reason);
    let state=result.state, commits=0, dispose=()=>{};
    function render(){
      dispose();
      document.querySelector("#state").textContent=JSON.stringify(state);
      document.querySelector("#commits").textContent=String(commits);
      if(!state.choice){document.querySelector("#choice").textContent="選択完了";return;}
      dispose=mountGrowthChoice(document.querySelector("#choice"),state,catalog,{player:"ロッシ",companion:"同行者"},input=>{
        const next=chooseSkill(state,input,catalog);if(!next.accepted)throw new Error(next.reason);
        state=next.state;commits++;render();
      });
    }
    render();
  </script>
</html>
