<!doctype html>
<html lang="ja">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>物品と装備の公開画面・初期保存条件</title>
  <div id="app"></div>
  <script type="module">
    import "/src/web/style.css";
    import { characters } from "/src/content/characters.ts";
    import { initialGameOptions } from "/src/content/initialGameOptions.ts";
    import { saveDefinitions } from "/src/content/saveDefinitions.ts";
    import { createInitialGameState } from "/src/game/createInitialGameState.ts";
    import { editHomeEquipment } from "/src/game/equipmentRuntime.ts";
    import { createInventory } from "/src/game/inventory.ts";
    import { createParty } from "/src/game/party.ts";
    import { mountCampaign } from "/src/web/campaignUi.ts";
    import { writeSlot } from "/src/web/saveSlot.ts";

    let game = {
      adventure: createInitialGameState(initialGameOptions),
      party: createParty(characters, ["player", "gilberta"]),
      inventory: createInventory(),
      dungeon: null,
    };
    for (const [id, slot, instance] of [
      ["player", "weapon", "weapon-1"], ["player", "armor", "armor-1"],
      ["gilberta", "weapon", "weapon-2"], ["gilberta", "armor", "armor-2"],
    ]) {
      const result = editHomeEquipment(game, "home", id, slot, instance, characters, saveDefinitions.skills);
      if (!result.accepted) throw new Error("Initial equipment input rejected");
      game = result.state;
    }
    // Legal initial save input: both members have recovered while wearing +4 HP armour.
    // writeSlot validates this through the production save parser before any UI mounts.
    game = { ...game, party: { ...game.party, members: game.party.members.map(member => ({
      ...member, hp: member.id === "player" ? 24 : 22,
    })) } };
    const saved = writeSlot(game, saveDefinitions);
    if (!saved.saved) throw new Error(saved.message);
    mountCampaign(document.querySelector("#app"));
  </script>
</html>
