name: CI

on:
  push:
    branches: [main, codex/pr92-recovery-20261003]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git-lfs
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Trust checked-out workspace for container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check, build each entry once, and run the complete game scope
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run test:browser:inside
