name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      design_image: ${{ steps.design-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: scripts/design-environment.mjs
          sparse-checkout-cone-mode: false
      - id: design-image
        name: Resolve the shared Docker image
        run: |
          node --input-type=module -e 'import { DESIGN_IMAGE } from "./scripts/design-environment.mjs"; process.stdout.write(`image=${DESIGN_IMAGE}\n`)' >> "$GITHUB_OUTPUT"

  verify:
    needs: environment
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.environment.outputs.design_image }}
      options: --init --ipc=host
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git-lfs
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Trust checked-out workspace for container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache npm downloads using the container's Node
        uses: actions/setup-node@v7
        with:
          cache: npm
      - id: dependencies
        run: npm ci
      - id: signature-key
        name: Resolve verified input cache keys
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/design-pipeline.mjs --github-output
      - id: design-cache
        name: Restore verified design inputs only
        uses: actions/cache/restore@v4
        with:
          path: .openpencil/design-snapshot.json
          key: ${{ steps.signature-key.outputs.key }}
          restore-keys: |
            ${{ steps.signature-key.outputs.previous }}
            ${{ steps.signature-key.outputs.base }}
            ${{ steps.signature-key.outputs.main }}
      - name: Check, build each entry once, and run the complete game scope
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run test:browser:inside
      - name: Test isolated component rendering and interactions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:storybook:inside
      - name: Compare affected design components and screens
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          DESIGN_IN_CONTAINER: "1"
        run: npm run openpencil:verify -- --changed --container-root "$GITHUB_WORKSPACE"
      - name: Summarize design comparison
        if: ${{ !cancelled() && hashFiles('test-results/openpencil/verification/report.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("test-results/openpencil/verification/report.json", "utf8"));
          const failures = report.targets.filter((target) => target.error || !target.comparison?.identical).length;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "| Compared | Failed | Complete | Identical |",
            "| --- | --- | --- | --- |",
            `| ${report.targets.length} | ${failures} | ${report.complete} | ${report.identical} |`,
            "",
            `Errors: ${report.errors.length}`,
            `Document SHA256: \`${report.inputSHA256}\``,
            `Bindings SHA256: \`${report.bindingsSHA256}\``,
            `Docker image: \`${report.environment.image}\``,
            `Workers: export ${report.parallelism?.export.workers ?? 0}, capture ${report.parallelism?.capture?.workers ?? 0}`,
            `Seconds: ${JSON.stringify(report.timings)}`,
            "",
          ].join("\n"));
          NODE
      - name: Save successful design inputs only
        if: ${{ success() && steps.design-cache.outputs.cache-hit != 'true' && hashFiles('.openpencil/design-snapshot.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .openpencil/design-snapshot.json
          key: ${{ steps.signature-key.outputs.key }}
      - name: Prepare bounded failure diagnostics
        if: ${{ failure() && hashFiles('test-results/openpencil/verification/report.json') != '' }}
        run: node scripts/design-artifacts.mjs test-results/openpencil/verification/report.json
      - name: Upload failed design comparisons only
        if: ${{ failure() && hashFiles('test-results/design-failures/report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-failures
          path: test-results/design-failures/
          retention-days: 1
          if-no-files-found: error
