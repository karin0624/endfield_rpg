name: CI

on:
  push:
    branches: [main, codex/pr92-recovery-20261003]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record tested integration revision
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p coverage
          git rev-parse HEAD > coverage/revision.txt
          echo "head=$PR_HEAD" >> coverage/revision.txt
          echo "base=$PR_BASE" >> coverage/revision.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results-and-coverage
          path: |
            test-results/vitest*.json
            coverage/unit/
            coverage/revision.txt
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - run: apt-get update && apt-get install -y git-lfs ffmpeg python3-pil
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Record tested integration revision
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p coverage
          git rev-parse HEAD > coverage/revision.txt
          echo "head=$PR_HEAD" >> coverage/revision.txt
          echo "base=$PR_BASE" >> coverage/revision.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --config playwright.evidence.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-sequence-evidence
          path: |
            test-results/**/sequence-*.png
            test-results/**/sequence-*.mp4
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:e2e:inside
        if: success() || failure()
      - name: Check all collected browser cases executed and passed
        if: success() || failure()
        run: node scripts/check-test-execution.mjs playwright test-results/playwright-discovery.json test-results/playwright.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/playwright*.json
            coverage/revision.txt
            playwright-report/
          if-no-files-found: error
      - name: Compare approved party UI images
        if: success() || failure()
        run: python3 scripts/compare-party-ui.py test-results test-results/approved-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-approval-comparison
          path: test-results/approved-comparison/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-flow-previews
          path: |
            test-results/**/campaign-*.png
            test-results/**/formation-*.png
            test-results/**/party-*.png
            test-results/**/approved-*.png
            test-results/**/*-readiness.json
          if-no-files-found: error
          retention-days: 14

  browser-coverage:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - run: apt-get update && apt-get install -y git-lfs ffmpeg python3-pil
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Record tested integration revision
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p coverage
          git rev-parse HEAD > coverage/revision.txt
          echo "head=$PR_HEAD" >> coverage/revision.txt
          echo "base=$PR_BASE" >> coverage/revision.txt
      - run: npm ci
      - run: node scripts/check-assets.mjs
      - run: npm run test:coverage:inside
      - name: Check all analysis-run cases executed and passed
        if: success() || failure()
        run: node scripts/check-test-execution.mjs playwright test-results/playwright-coverage-discovery.json test-results/playwright-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-coverage-and-results
          path: |
            coverage/browser/
            coverage/revision.txt
            test-results/playwright-coverage*.json
            playwright-report/coverage/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-coverage-failures
          path: test-results/coverage/
          retention-days: 14
