name: CI

on:
  push:
    branches: [main, codex/pr92-recovery-20261003]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - run: apt-get update && apt-get install -y git-lfs ffmpeg
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: npm ci
      - run: npm run build
      - run: BATTLE_SEQUENCE_VIDEO=1 PLAYWRIGHT_EDITOR=1 npx playwright test --project ui --grep '代表シーケンス.*実素材'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-sequence-evidence
          path: |
            test-results/**/sequence-*.png
            test-results/**/sequence-*.mp4
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:e2e:inside
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-flow-previews
          path: |
            test-results/campaign-*/campaign-*.png
            test-results/party-ui-*/formation-*.png
            test-results/party-ui-*/party-*.png
            test-results/**/*-readiness.json
          if-no-files-found: error
          retention-days: 14
